name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            archive="burning_${version}_${os}_${arch}.tar.gz"
            stage="$(mktemp -d)"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$stage/burning" .
            tar -C "$stage" -czf "dist/$archive" burning
            rm -rf "$stage"
          done
          (
            cd dist
            sha256sum *.tar.gz > SHA256SUMS
          )
      - name: Smoke test Linux archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf "dist/burning_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C smoke
          test "$(smoke/burning --version)" = "burning ${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
